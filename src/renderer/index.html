<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' media: https: data: blob:; font-src 'self'; media-src 'self' media: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>EvEX-MPP</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/srp.css" />
    <link rel="stylesheet" href="css/fleets.css" />
    <link rel="stylesheet" href="css/mentions.css" />
    <link rel="stylesheet" href="css/fleet-manual.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app" class="booting">
      <div id="app-bg" aria-hidden="true"></div>
      <header id="titlebar">
        <button id="tb-sidebar" class="icon-btn" title="Mostrar/ocultar barra lateral" aria-label="Barra lateral" data-i18n="title aria-label">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" /></svg></span>
        </button>
        <img class="tb-logo" src="assets/logo-small.svg" alt="" />
        <span class="tb-name">EvEX-MPP</span>
        <button id="tb-switch" class="tb-switch" title="Saltar a sala o contacto (Ctrl+K)" data-i18n="title">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg></span>
          <span data-i18n="text">Ir a sala o contacto…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <span class="spacer"></span>
        <div id="tb-eve" class="tb-eve" title="Hora EVE (UTC)" data-i18n="title"><span>EVE</span><b id="tb-eve-time">--:--</b></div>
        <button id="tb-mentions" class="icon-btn" title="Menciones (también con Ctrl+K)" aria-label="Menciones" data-i18n="title aria-label">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8" /></svg></span>
          <span class="tb-dot" aria-hidden="true"></span>
        </button>
        <button id="tb-rooms" class="icon-btn" title="Explorar salas (Ctrl+B)" aria-label="Explorar salas" data-i18n="title aria-label">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /><circle cx="12" cy="12" r="10" /></svg></span>
        </button>
        <button id="tb-search" class="icon-btn" title="Buscar en el historial (Ctrl+F)" aria-label="Buscar en el historial" data-i18n="title aria-label">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></svg></span>
        </button>
        <button id="tb-settings" class="icon-btn" title="Preferencias (Ctrl+,)" aria-label="Preferencias" data-i18n="title aria-label">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg></span>
        </button>
        <div class="tb-window-controls">
          <button id="tb-minimize" class="tb-wc" title="Minimizar" aria-label="Minimizar" data-i18n="title aria-label">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 6h8"/></svg>
          </button>
          <button id="tb-maximize" class="tb-wc" title="Maximizar" aria-label="Maximizar" data-i18n="title aria-label">
            <svg class="wc-max" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="2" width="8" height="8" rx="0.5"/></svg>
            <svg class="wc-restore" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="4" width="6" height="6" rx="0.5"/><path d="M4 4V2.5c0-.3.2-.5.5-.5h5c.3 0 .5.2.5.5v5c0 .3-.2.5-.5.5H8"/></svg>
          </button>
          <button id="tb-close" class="tb-wc tb-wc-close" title="Cerrar" aria-label="Cerrar" data-i18n="title aria-label">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 3l6 6M9 3l-6 6"/></svg>
          </button>
        </div>
      </header>

      <div id="main">
        <aside id="sidebar">
          <div id="sidebar-bg" aria-hidden="true"></div>
          <div id="sidebar-accounts"></div>
          <div class="sb-search">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg></span>
            <input id="sb-filter" class="input" placeholder="Filtrar salas y contactos…" data-i18n="placeholder" />
          </div>
          <div id="sidebar-content"></div>
        </aside>
        <div class="resizer" data-for="sidebar" title="Arrastra para cambiar el ancho" data-i18n="title"></div>

        <section id="center">
          <nav id="tabs" class="empty"></nav>
          <div id="conv-container">
            <div id="welcome" class="welcome"></div>
          </div>
        </section>

        <div class="resizer" data-for="occupants" title="Arrastra para cambiar el ancho" data-i18n="title"></div>
        <aside id="occupants" class="hidden">
          <header class="occ-head">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg></span>
            <span data-i18n="text">Participantes</span>
            <span id="occ-count" class="sb-count">0</span>
          </header>
          <div class="sb-search"><input id="occ-filter" class="input" placeholder="Buscar participante…" data-i18n="placeholder" /></div>
          <div id="occ-list"></div>
        </aside>
      </div>

      <div id="modal-root"></div>
      <div id="menu-root"></div>
      <div id="toast-root"></div>
    </div>
    <script type="module" src="js/resize.js"></script>
  </body>
</html>
