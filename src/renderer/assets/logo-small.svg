<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icono pequeño de EvEX-MPP (barra de título): solo el cyno, más grueso. Mismo dibujo que src/main/icon.js a ≤ 48 px. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="80%" r="85%">
      <stop offset="0" stop-color="#1b3a66"/>
      <stop offset="1" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-20%" width="220%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="84" y="28" width="88" height="162" rx="44" fill="#bfe6ff" opacity=".5" filter="url(#glow)"/>
  <rect x="106" y="28" width="44" height="162" rx="22" fill="url(#beam)"/>
  <ellipse cx="128" cy="190" rx="96" ry="30" fill="none" stroke="#bfe6ff" stroke-width="22" opacity=".95"/>
  <ellipse cx="128" cy="190" rx="46" ry="14" fill="#ffffff" filter="url(#soft)"/>
</svg>
