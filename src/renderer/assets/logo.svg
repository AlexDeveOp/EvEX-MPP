<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icono de EvEX-MPP: un cyno (columna de luz con su anillo) y la flota llegando. Mismo dibujo que src/main/icon.js. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="80%" r="85%">
      <stop offset="0" stop-color="#1b3a66"/>
      <stop offset="1" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-20%" width="220%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="106" y="26" width="44" height="164" rx="22" fill="#bfe6ff" opacity=".55" filter="url(#glow)"/>
  <rect x="117" y="26" width="22" height="164" rx="11" fill="url(#beam)"/>
  <ellipse cx="128" cy="190" rx="72.6" ry="20.9" fill="none" stroke="#bfe6ff" stroke-width="10" opacity=".95"/>
  <ellipse cx="128" cy="190" rx="35" ry="10" fill="#ffffff" filter="url(#soft)"/>
  <g fill="#ffffff">
    <path d="M52 128 71.8 165.4 52 155.5 32.2 165.4Z"/>
    <path d="M204 128 223.8 165.4 204 155.5 184.2 165.4Z"/>
    <path d="M74 79 89.3 107.9 74 100.3 58.7 107.9Z"/>
    <path d="M182 79 197.3 107.9 182 100.3 166.7 107.9Z"/>
