# Comprueba cada cambio subido a main y cada pull request: sintaxis, ESLint, tests, traducciones y vulnerabilidades.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # La app es para Windows; Linux comprueba que el código no depende de rutas ni saltos de línea de Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis
        run: npm run check

      - name: Revisar el código (ESLint)
        run: npm run lint

      - name: Tests (incluye integración con el servidor XMPP simulado)
        run: npm test

      - name: Comprobar traducciones
        run: npm run i18n

      - name: Vulnerabilidades en las dependencias de la app
        run: npm audit --omit=dev --audit-level=high

  # Compila el AppImage y el .deb para que un fallo de empaquetado en Linux se vea en el PR y no al publicar.
  # No es un check obligatorio para fusionar.
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar AppImage y .deb (y comprobar que build/ no cambia)
        run: npm run dist:linux

      - name: Contenido del .deb
        run: |
          dpkg-deb -I dist/*.deb | sed -n '/Package:/,$p'
          dpkg-deb -c dist/*.deb | grep -E "applications/.*\.desktop|icons/.*\.png|chrome-sandbox"
