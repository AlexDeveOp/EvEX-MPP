# Publica una versión al subir una etiqueta vX.Y.Z: compila en Windows (instalador y portable) y en Linux
# (AppImage y .deb) desde el código de esa etiqueta, comprueba, genera un único checksums.txt (SHA-256) y una
# única atestación de procedencia con todos los ficheros (repos públicos) y crea la release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Linux: AppImage y .deb, compilados en Ubuntu. Los recoge el job de Windows, que publica la release.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: La versión de package.json debe coincidir con la etiqueta
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "${{ github.ref_name }}" ] || { echo "package.json ($version) no coincide con la etiqueta ${{ github.ref_name }}"; exit 1; }

      - name: Compilar AppImage y .deb
        run: npm run dist:linux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 1

  release:
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write # crear la release
      id-token: write # firmar la atestación de procedencia
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis
        run: npm run check

      - name: Revisar el código (ESLint)
        run: npm run lint

      - name: Tests (incluye integración con el servidor XMPP simulado)
        run: npm test

      - name: Comprobar traducciones
        run: npm run i18n

      - name: Vulnerabilidades en las dependencias de la app
        run: npm audit --omit=dev --audit-level=high

      - name: La versión de package.json debe coincidir con la etiqueta
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "package.json ($version) no coincide con la etiqueta ${{ github.ref_name }}" }

      - name: Compilar instalador y portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Paquete para la Microsoft Store: se sube a mano en Partner Center y lo firma Microsoft tras la certificación.
      # Sin firmar no se puede instalar, así que no va en la release: queda como artefacto del workflow.
      - name: Compilar el paquete de la Microsoft Store
        run: npm run dist:store

      - name: Guardar el paquete de la Store como artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-package
          path: dist/*.appx
          if-no-files-found: error
          retention-days: 30

      - name: Traer el AppImage y el .deb del job de Linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist

      - name: Generar checksums.txt (SHA-256)
        shell: pwsh
        run: |
          Set-Location dist
          $lines = Get-ChildItem *.exe, *.AppImage, *.deb | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          # Saltos de línea LF: así funciona también `sha256sum -c checksums.txt` (Linux, macOS, Git Bash).
          [IO.File]::WriteAllText("$PWD/checksums.txt", ($lines -join "`n") + "`n")
          Get-Content checksums.txt

      # Las atestaciones son gratuitas en repositorios públicos; en privados dependen del plan de GitHub.
      - name: Atestación de procedencia
        id: attest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/checksums.txt

      # La atestación también va como fichero en la release, para verificarla sin conexión
      # (`gh attestation verify <fichero> --bundle <.intoto.jsonl> --repo ...`) y para que Scorecard la detecte.
      - name: Copiar la atestación a dist
        if: steps.attest.outcome == 'success'
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" "dist/EvEX-MPP-${{ github.ref_name }}.intoto.jsonl"

      - name: Preparar notas desde CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $match.Success) { throw "CHANGELOG.md no tiene sección para $version" }
          $verify = if ("${{ github.event.repository.visibility }}" -eq "public") {
            "`n- Provenance / Procedencia: ``gh attestation verify <file> --repo ${{ github.repository }}`` (offline: add ``--bundle EvEX-MPP-${{ github.ref_name }}.intoto.jsonl``)."
          } else { "" }
          @"
          $($match.Groups[1].Value.Trim())

          ## Download / Descarga

          ### Windows (x64)

          | File | What it is / Qué es |
          |---|---|
          | ``EvEX-MPP-Setup-$($version).exe`` | Installer: Start menu, uninstaller, optional start with Windows. / Instalador. |
          | ``EvEX-MPP-$($version)-portable.exe`` | Portable: nothing to install. / Portable, sin instalar. |

          - Verify / Verifica: ``Get-FileHash <file> -Algorithm SHA256`` must equal its line in ``checksums.txt``.
          - Not code-signed yet: SmartScreen → "More info" → "Run anyway" / «Más información» → «Ejecutar de todas formas». [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)

          ### Linux (x64)

          | File | What it is / Qué es |
          |---|---|
          | ``EvEX-MPP-$($version)-x86_64.AppImage`` | AppImage: ``chmod +x`` and run. Needs FUSE 2 (``libfuse2t64`` on Ubuntu 24.04+, ``libfuse2`` on 22.04). |
          | ``evex-mpp_$($version)_amd64.deb`` | Debian/Ubuntu package: ``sudo apt install ./evex-mpp_$($version)_amd64.deb`` |

          - Verify / Verifica: ``sha256sum -c --ignore-missing checksums.txt`` (in the download folder).
          - Requirements (keyring, tray, notifications on Wayland): [Linux notes](https://github.com/${{ github.repository }}#linux) · [Linux en español](https://github.com/${{ github.repository }}/blob/main/README.es.md#linux)

          ### All files / Todos los archivos
          - Built by GitHub Actions from tag ``${{ github.ref_name }}`` (commit ``${{ github.sha }}``). ``checksums.txt`` lists the SHA-256 of every file.$verify
          - [Privacy policy](https://github.com/${{ github.repository }}/blob/main/PRIVACY.md) · [How to verify your download](https://github.com/${{ github.repository }}#how-to-verify-your-download)
          "@ | Set-Content -Encoding utf8 notes.md
          Get-Content notes.md

      - name: Publicar la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist\*.exe, dist\*.AppImage, dist\*.deb, dist\*.intoto.jsonl | ForEach-Object FullName) + "dist\checksums.txt"
          gh release create "${{ github.ref_name }}" @files --title "EvEX-MPP ${{ github.ref_name }}" --notes-file notes.md --verify-tag
